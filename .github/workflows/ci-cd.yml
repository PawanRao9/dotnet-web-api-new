name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  DOCKER_IMAGE_NAME: blue-green-api

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore tests/BlueGreenApi.Tests/BlueGreenApi.Tests.csproj
      
    - name: Build
      run: dotnet build tests/BlueGreenApi.Tests/BlueGreenApi.Tests.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test tests/BlueGreenApi.Tests/BlueGreenApi.Tests.csproj --configuration Release --no-restore --verbosity normal

  deploy:
    name: Deploy (Blue-Green)
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate deployment secrets
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      run: |
        if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
          echo "::error title=Missing Deployment Secrets::DEPLOY_HOST, DEPLOY_USER, or DEPLOY_SSH_KEY is not set"
          exit 1
        fi
        echo "✓ All deployment secrets are configured"
  
    - name: Validate deployment secrets
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      run: |
        if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
          echo "::error title=Missing Deployment Secrets::DEPLOY_HOST, DEPLOY_USER, or DEPLOY_SSH_KEY is not set"
          exit 1
        fi
        echo "✓ All deployment secrets are configured"

    - name: Execute Blue-Green Deployment on Remote Host
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        script: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Deploying branch: $BRANCH_NAME"

          mkdir -p /opt/dotnet-blue-green-deployment
          cd /opt/dotnet-blue-green-deployment

          if [ -d .git ]; then
            echo "Pulling latest code..."
            git fetch origin
            git checkout "$BRANCH_NAME" || true
            git pull origin "$BRANCH_NAME"
          else
            echo "Cloning repository..."
            git clone https://github.com/PawanRao9/.net-web-api.git .
            git checkout "$BRANCH_NAME" || true
          fi
          echo "Starting deployment..."
          bash ./scripts/deploy.sh "${{ github.sha }}"

          echo "Running post-deployment status check..."
          bash ./scripts/status.sh
