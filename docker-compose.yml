services:
  # The NGINX Reverse Proxy - routes traffic to the active environment
  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/blue.conf:/etc/nginx/blue.conf:ro
      - ./docker/nginx/green.conf:/etc/nginx/green.conf:ro
      - ./docker/nginx/active.conf:/etc/nginx/active.conf
    depends_on:
      - blue-api
      - green-api
    networks:
      - blue-green-network

  # BLUE Environment
  blue-api:
    image: blue-green-api:latest
    build: .
    environment:
      - APP_ENVIRONMENT=BLUE
      - APP_VERSION=1.0.0
    networks:
      - blue-green-network

  # GREEN Environment
  green-api:
    image: blue-green-api:latest
    build: .
    environment:
      - APP_ENVIRONMENT=GREEN
      - APP_VERSION=2.0.0
    networks:
      - blue-green-network

networks:
  blue-green-network:
    driver: bridge
